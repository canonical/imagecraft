name: dev
base: ubuntu@24.04
sdks:
  - name: uv
  - name: copilot
  - name: node
    channel: 24/stable
  - name: rust
  - name: project-imagecraft-setup
actions:
  setup: make setup
  test: make test
  test-fast: make test-fast
  test-slow: make test-slow
  lint: make lint
  format: make format
  pack: make pack
  pack-snap: make pack-snap
  install-craft-stack-branch: |
    if [ "$#" -gt 1 ]; then
      echo 'usage: workshop run dev -- install-craft-stack-branch [branch]'
      exit 2
    fi
    branch="${1:-main}"
    for package in craft-application craft-parts craft-providers; do
      uv pip install --python .venv/bin/python --upgrade "$package @ git+https://github.com/canonical/$package.git@$branch"
    done
  install-craft-application-branch: |
    if [ "$#" -gt 1 ]; then
      echo 'usage: workshop run dev -- install-craft-application-branch [branch]'
      exit 2
    fi
    branch="${1:-main}"
    uv pip install --python .venv/bin/python --upgrade "craft-application @ git+https://github.com/canonical/craft-application.git@$branch"
  install-craft-parts-branch: |
    if [ "$#" -gt 1 ]; then
      echo 'usage: workshop run dev -- install-craft-parts-branch [branch]'
      exit 2
    fi
    branch="${1:-main}"
    uv pip install --python .venv/bin/python --upgrade "craft-parts @ git+https://github.com/canonical/craft-parts.git@$branch"
  install-craft-providers-branch: |
    if [ "$#" -gt 1 ]; then
      echo 'usage: workshop run dev -- install-craft-providers-branch [branch]'
      exit 2
    fi
    branch="${1:-main}"
    uv pip install --python .venv/bin/python --upgrade "craft-providers @ git+https://github.com/canonical/craft-providers.git@$branch"
