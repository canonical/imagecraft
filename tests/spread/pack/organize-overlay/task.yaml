summary: Pack an image organizing to the overlay

systems: [ubuntu-24.04-64]

execute: |
  imagecraft pack --verbosity verbose --destructive-mode

  test -f pc.img

restore: |
  # Retry: imagecraft clean can transiently fail to remove work dirs
  # if internal build mounts haven't fully released under host load.
  for i in $(seq 1 5); do
      imagecraft clean --destructive-mode && break
      sleep 2
  done
  rm -rf pc.img || true

debug: |
  df -h
  mount  -l
