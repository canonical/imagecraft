summary: Data written to sectors outside partitions of the volume is preserved

environment:
  CRAFT_BUILD_ENVIRONMENT/lxd: lxd
  CRAFT_BUILD_ENVIRONMENT/multipass: multipass
  CRAFT_BUILD_ENVIRONMENT/destructive: host

prepare: |
  . /etc/os-release
  sed "s/__BUILD_BASE__/${ID}@${VERSION_ID}/" imagecraft-template.yaml > imagecraft.yaml

  rm -rf disk.img

execute: |
  . /etc/os-release
  if [[ "${CRAFT_BUILD_ENVIRONMENT}" == "multipass" && "${VERSION_CODENAME}" == "questing" ]]; then
    echo "Skipping because multipass doesn't have a questing VM"
    exit 0
  fi
  if [[ "${CRAFT_BUILD_ENVIRONMENT}" == "multipass" && "${VERSION_CODENAME}" == "resolute" ]]; then
    echo "Skipping because multipass doesn't have a resolute VM"
    exit 0
  fi

  imagecraft pack --verbose --ignore=unmaintained
  test -f disk.img

  # Verify that sector 100 is actually in the gap between the GPT partition
  # entries (end at sector 33) and the first partition (typically at 2048).
  first_partition_start=$(sfdisk --json disk.img | jq '.partitiontable.partitions | map(.start) | min')
  test 100 -lt "${first_partition_start}"

  # Confirm the string our override-build wrote is present at sector 100.
  dd if=disk.img bs=512 skip=100 count=1 status=none | MATCH 'IMAGECRAFT_SECTOR_WRITE_TEST'

restore: |
  rm -rf disk.img parts stage prime
  imagecraft clean
