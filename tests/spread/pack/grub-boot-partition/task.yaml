summary: Pack an image with GRUB and a dedicated boot partition

systems: [ubuntu-24.04-64]

execute: |
  #shellcheck source=tests/spread/tools.sh
  . "$PROJECT_PATH/tests/spread/tools.sh"

  GRUB_INSTALL_LOG="Preparing bootloader files"

  imagecraft pack --verbosity verbose --destructive-mode 2>&1 >/dev/null | MATCH "$GRUB_INSTALL_LOG"

  # Check that the message was actually written to the logfile.
  imagecraft_log_file=$(find /root/.local/state/imagecraft/log/ -name 'imagecraft*.log' | sort -n | tail -n1)
  MATCH "$GRUB_INSTALL_LOG" "$imagecraft_log_file"
  # Also check detailed of the installation were logged
  MATCH "Generating grub configuration file" "$imagecraft_log_file"
  MATCH "Adding boot menu entry for UEFI Firmware Settings" "$imagecraft_log_file"

  IMG_NAME=pc.img
  test -f ${IMG_NAME}

  TMP_MOUNT=$(tools.mount_image "${IMG_NAME}")

  tools.check_partition_metadata "${TMP_MOUNT}" "p1"

  BOOT_CFG=${TMP_MOUNT}/p2/grub/grub.cfg
  test -f "$BOOT_CFG"
  NOMATCH "/boot/" "$BOOT_CFG"

  KERNEL_PATH=$(awk '$1 ~ /^linux(efi)?$/ { print $2; exit }' "$BOOT_CFG")
  INITRD_PATH=$(awk '$1 == "initrd" { print $2; exit }' "$BOOT_CFG")

  test -n "$KERNEL_PATH"
  test -n "$INITRD_PATH"
  test -f "${TMP_MOUNT}/p2${KERNEL_PATH}"
  test -f "${TMP_MOUNT}/p2${INITRD_PATH}"

restore: |
  #shellcheck source=tests/spread/tools.sh
  . "$PROJECT_PATH/tests/spread/tools.sh"

  tools.umount_image
  imagecraft clean --destructive-mode
  rm -rf pc.img || true

debug: |
  df -h
  du -h -d 1 /tmp/
  mount -l
  if [ -f loop.txt ]; then
      cat loop.txt
  fi
  if [ -f tmpmount.txt ]; then
      cat tmpmount.txt
  fi
  losetup -l
