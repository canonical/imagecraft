summary: Pack a simple image using multipass

systems:
  - ubuntu-22.04-64
  - ubuntu-24.04-64
  # - ubuntu-26.04-64  # Disabled until multipass 1.17 is released
  - ubuntu-26.10-64

environment:
  CRAFT_BUILD_ENVIRONMENT: multipass

prepare: |
  snap install multipass --channel=latest/beta
  . /etc/os-release
  sed "s/__BUILD_BASE__/${ID}@${VERSION_ID}/" imagecraft-template.yaml > imagecraft.yaml

execute: |
  imagecraft pack --verbose --ignore=unmaintained
  test -f disk.img

restore: |
  snap remove --no-wait --purge multipass
  imagecraft clean
  rm -f disk.img imagecraft.yaml
