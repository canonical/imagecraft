summary: Pack an image with non-sequential partition numbers.

execute: |
  #shellcheck source=tests/spread/tools.sh
  . "$PROJECT_PATH/tests/spread/tools.sh"

  imagecraft pack --verbose --ignore=unmaintained

  test -f disk.img

  expected_partitions=$(yq -P .volumes.disk.structure[].number imagecraft.yaml | sed 's/^/disk.img/' | sort)
  actual_partitions=$(sfdisk --json disk.img | jq -r .partitiontable.partitions[].node | sort)

  if [[ "${expected_partitions}" != "${actual_partitions}" ]] ; then
    ERROR "Expected and actual partitions don't match.\n Expected:\n${expected_partitions}\n Actual:\n${actual_partitions}"
  fi

  TMP_MOUNT=$(tools.mount_image "disk.img")

  tools.check_partition_metadata "${TMP_MOUNT}" "p13"

restore: |
  #shellcheck source=tests/spread/tools.sh
  . "$PROJECT_PATH/tests/spread/tools.sh"

  tools.umount_image
  imagecraft clean
  rm -rf disk.img || true
