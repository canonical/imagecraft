summary: Test uc-prepare plugin

systems:
  # We can only run this on systems that are also snap bases, and when we do that
  # we need to get a new Ubuntu Core assertion file from
  # https://github.com/canonical/models/
  - ubuntu-22.04-64
  - ubuntu-24.04-64
  - ubuntu-26.04-64

prepare: |
  . /etc/os-release
  cp "model-${ID}@${VERSION_ID}.assert" model.assert

execute: |
  imagecraft pack --ignore=unmaintained

  test -f disk.img

  . "${PROJECT_PATH}/tests/spread/tools.sh"
  IMAGE_DIR=$(tools.mount_image disk.img)
  test -f "$IMAGE_DIR"/p1/snaps/pc_*.snap
  test -f "$IMAGE_DIR"/p1/snaps/pc-kernel_*.snap
  test -f "$IMAGE_DIR"/p1/snaps/snapd_*.snap

  . /etc/os-release
  core_version="${VERSION_ID:0:2}"
  test -f "$IMAGE_DIR/p1/snaps/core${core_version}"_*.snap

restore: |
  rm -f disk.img model.assert
