summary: Test uc-prepare plugin

systems: [ubuntu-24.04-64]

execute: |
  #shellcheck source=tests/spread/tools.sh
  . "$PROJECT_PATH/tests/spread/tools.sh"

  imagecraft pack --verbose

  test -f disk.img

  TMP_MOUNT=$(tools.mount_image "disk.img")

  test -f "${TMP_MOUNT}"/p1/snaps/pc_*.snap
  test -f "${TMP_MOUNT}"/p1/snaps/pc-kernel_*.snap
  test -f "${TMP_MOUNT}"/p1/snaps/core24_*.snap
  test -f "${TMP_MOUNT}"/p1/snaps/snapd_*.snap

restore: |
  #shellcheck source=tests/spread/tools.sh
  . "$PROJECT_PATH/tests/spread/tools.sh"

  tools.umount_image
  rm -rf disk.img
  imagecraft clean
