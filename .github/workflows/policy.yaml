name: Check policy
on:
  pull_request:
  push:
    branches:
      - main
      - hotfix/*

jobs:
  policy:
    permissions:
      contents: read
      security-events: write
    uses: canonical/starflow/.github/workflows/policy.yaml@main
  python-scans:
    name: Security scan
    uses: canonical/starflow/.github/workflows/scan-python.yaml@main
    with:
      osv-exclude-paths: |
        docs
      uv-export-no-groups: |
        docs
        docs-starter-pack
