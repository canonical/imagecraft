name: Snap

on:
  pull_request:
  push:
    branches:
      - "feature/**"
  # allow manual re-publishing as branches expire after 30 days
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  filter:
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: read
    outputs:
      source-files: ${{ steps.filter.outputs.source-files }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # Combine multiple negation checks into a union (¬A ∧ ¬B ∧ ¬C), because individual entries are checked independently (A ∨ B ∨ C).
          # If we ever need to filter only for docs, glob 'docs/**/*' and '**/*.md'
          filters: |
            source-files:
              - '!({docs/**,*.md,**/*.md,.readthedocs.yaml})'
  build:
    runs-on: ubuntu-latest
    needs: filter
    permissions:
      contents: read
    steps:
      - name: Decision to Publish
        id: decisions
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          SOURCE_FILES: ${{ needs.filter.outputs.source-files }}
        run: |
          # Secrets cannot be used in conditionals, so this is our dance:
          # https://github.com/actions/runner/issues/520
          if [[ -n "$SNAPCRAFT_STORE_CREDENTIALS" && "$SOURCE_FILES" = "true" ]]; then
            echo PUBLISH=true >> "$GITHUB_OUTPUT"
          else
            echo PUBLISH= >> "$GITHUB_OUTPUT"
          fi
      - if: steps.decisions.outputs.PUBLISH == 'true'
        name: Checkout imagecraft
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - if: steps.decisions.outputs.PUBLISH == 'true'
        name: Build imagecraft snap
        uses: canonical/craft-actions/snapcraft/pack@57ce4083bf8bfad3ea1aacd8fb9474eff4480732
        with:
          channel: latest/edge
        id: build-imagecraft

      - if: steps.decisions.outputs.PUBLISH == 'true'
        name: Upload imagecraft snap artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snap
          path: ${{ steps.build-imagecraft.outputs.snaps }}

      - name: Get branch name
        id: vars
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]
          then
            echo "branch=pr-${{ github.event.number }}" >> "$GITHUB_OUTPUT"
          else
            branch="${GITHUB_REF#refs/*/}"
            branch="${branch#feature/}"
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.decisions.outputs.PUBLISH == 'true'
        name: Publish feature branch to edge/${{ steps.vars.outputs.branch }}
        uses: canonical/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40 # v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build-imagecraft.outputs.snaps }}
          release: edge/${{ steps.vars.outputs.branch }}
